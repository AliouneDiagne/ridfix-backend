# ==========================================
# 1. SERVER CONFIG
# ==========================================
server.port=3001
spring.application.name=RidfixBackend

# ==========================================
# 2. DATABASE (PostgreSQL Locale)
# ==========================================
# Se non trova variabili d'ambiente, usa i valori dopo i due punti
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridfix_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Allahou99!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# 3. RIDFIX CUSTOM CONFIGURATIONS
# ==========================================

# --- JWT (Auth) ---
ridfix.jwt.secret=${RIDFIX_JWT_SECRET:9f2c6a1d4b8e0a3c9f2c6a1d4b8e0a3c9f2c6a1d4b8e0a3c9f2c6a1d4b8e0a3c}
ridfix.jwt.issuer=ridfix-backend
ridfix.jwt.expiration-minutes=1440

# --- Cloudinary ---
ridfix.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:tuo_cloud_name}
ridfix.cloudinary.api-key=${CLOUDINARY_API_KEY:tua_api_key}
ridfix.cloudinary.api-secret=${CLOUDINARY_API_SECRET:tua_api_secret}
ridfix.cloudinary.folder=ridfix

# --- Mailgun ---
ridfix.mailgun.enabled=false