# ==========================================
# 1. SERVER CONFIG
# ==========================================
server.port=3001
spring.application.name=RidfixBackend

# ==========================================
# 2. DATABASE (PostgreSQL Locale)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridfix_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Allahou99!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# 3. RIDFIX CUSTOM CONFIGURATIONS
# ==========================================

# --- CORS (comma-separated origins) ---
ridfix.cors.origins=${RIDFIX_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# --- JWT (Auth) ---
ridfix.jwt.secret=${RIDFIX_JWT_SECRET:CHANGE_ME_SET_ENV}
ridfix.jwt.issuer=ridfix-backend
ridfix.jwt.expiration-minutes=1440

# --- Cloudinary ---
ridfix.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
ridfix.cloudinary.api-key=${CLOUDINARY_API_KEY:}
ridfix.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
ridfix.cloudinary.folder=ridfix

# --- Mailgun ---
ridfix.mailgun.enabled=${MAILGUN_ENABLED:false}
ridfix.mailgun.api-key=${MAILGUN_API_KEY:}
ridfix.mailgun.domain=${MAILGUN_DOMAIN:}
ridfix.mailgun.from=${MAILGUN_FROM:}
