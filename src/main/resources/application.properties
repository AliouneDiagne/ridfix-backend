# ==========================================
# 1. SERVER & PROJECT CONFIG
# ==========================================
server.port=3001
spring.application.name=RidfixBackend

# ==========================================
# 2. DATABASE (PostgreSQL)
# ==========================================
# Utilizza le variabili d'ambiente se presenti, altrimenti i valori di fallback
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ridfix_db}
spring.datasource.username=${DB_USER:ridfix_user}
spring.datasource.password=${DB_PASSWORD:RidfixPwd!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# 3. LOGGING
# ==========================================
logging.level.org.hibernate.SQL=warn

# ==========================================
# 4. RIDFIX CUSTOM CONFIGURATIONS
# ==========================================

# --- JWT (Auth) ---
# Assicurati che la secret sia almeno di 32 caratteri per HS256
ridfix.jwt.secret=${RIDFIX_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_CHARS_MIN}
ridfix.jwt.issuer=${RIDFIX_JWT_ISSUER:ridfix-backend}
ridfix.jwt.expiration-minutes=${RIDFIX_JWT_EXP_MINUTES:60}

# --- Cloudinary (Immagini) ---
ridfix.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
ridfix.cloudinary.api-key=${CLOUDINARY_API_KEY:}
ridfix.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
ridfix.cloudinary.folder=${CLOUDINARY_FOLDER:ridfix}

# --- Mailgun (Email) ---
ridfix.mailgun.enabled=${MAILGUN_ENABLED:false}
ridfix.mailgun.api-key=${MAILGUN_API_KEY:}
ridfix.mailgun.domain=${MAILGUN_DOMAIN:}
ridfix.mailgun.from=${MAILGUN_FROM:}